services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      RAG_PROJECT_PATH: /rag_project
      QDRANT_URL: http://host.docker.internal:6333
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    volumes:
      - type: bind
        source: ${RAG_PROJECT_PATH}
        target: /rag_project
        read_only: true

      - type: bind
        source: ${HF_CACHE_PATH}
        target: /root/.cache/huggingface
        read_only: true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
